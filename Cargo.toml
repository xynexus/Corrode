[workspace]
resolver = "2"
members = [
    "crates/corrode-core",
    "crates/corrode-daemon",
    "crates/corrode-web",
]
# Keep heavy, feature-gated path dependencies out of the base build/test graph. Each
# is a plain path dependency of corrode-daemon that only compiles under its feature:
#   third_party/helix-db            -> `--features helix`  (vendored HelixDB, AGPL)
#   crates/needle-toolcall-shim     -> `--features needle` (vendored Needle tool-call
#                                       shim, a merged-in CPU/candle experiment)
# Excluding them means `cargo build`/`cargo test` at the root never drags candle or
# HelixDB in, while the daemon can still pull each in behind its feature flag.
exclude = ["third_party", "crates/needle-toolcall-shim"]
# webui/ is a wasm crate on its own build target (trunk/wasm-pack), kept OUT of the
# native workspace so `cargo build` doesn't drag a wasm toolchain in. See webui/README.md.

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
async-trait = "0.1"
tokio-tungstenite = "0.26"
corrode-core = { path = "crates/corrode-core" }
