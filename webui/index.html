<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corrode</title>

    <!-- Vendored xterm.js + addons (copied to dist as-is), then loaded as classic
         scripts so their UMD globals exist before the wasm module runs. -->
    <link data-trunk rel="copy-file" href="assets/xterm.js" />
    <link data-trunk rel="copy-file" href="assets/addon-fit.js" />
    <link data-trunk rel="copy-file" href="assets/addon-webgl.js" />
    <link data-trunk rel="copy-file" href="assets/corrode-term.js" />
    <link data-trunk rel="css" href="assets/xterm.css" />
    <!-- KaTeX (js + css + fonts) for the agent console's LaTeX. -->
    <link data-trunk rel="copy-dir" href="assets/katex" />
    <link rel="stylesheet" href="katex/katex.min.css" />
    <link data-trunk rel="rust" data-bin="corrode-webui" data-wasm-opt="z" />
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="addon-webgl.js"></script>
    <script src="katex/katex.min.js"></script>
    <script src="katex/contrib/auto-render.min.js"></script>
    <script src="corrode-term.js"></script>

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        background: #14161a; color: #d7dbe0;
        display: flex; flex-direction: column;
      }
      .topbar {
        padding: 8px 14px; background: #0f1114; border-bottom: 1px solid #262a30;
        display: flex; align-items: center; gap: 10px;
      }
      .brand { color: #e08a4b; font-weight: 700; }
      /* Auth (sign-in) row in the topbar, and the repo selector in the explorer. */
      .auth { display: flex; gap: 6px; align-items: center; }
      .topbar input, .repo-bar input {
        background: #14161b; color: #d7dbe0; border: 1px solid #363b42;
        border-radius: 5px; padding: 3px 7px; font-size: 12px;
      }
      .auth-user { width: 90px; } .auth-token { width: 90px; }
      .repo-bar { gap: 6px; }
      .repo-input { flex: 1; min-width: 0; }
      .cols {
        flex: 1; min-height: 0;
        display: grid; grid-template-columns: 240px 5px 1fr 5px 340px;
      }
      .divider-v { cursor: col-resize; background: #1c1f24; touch-action: none; }
      .divider-h {
        cursor: row-resize; background: #1c1f24; flex: 0 0 5px; touch-action: none;
      }
      .divider-v:hover, .divider-h:hover { background: #3d454f; }
      section { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
      .explorer { border-right: 1px solid #262a30; }
      .agent { border-left: 1px solid #262a30; }
      .bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 6px 10px; border-bottom: 1px solid #262a30; color: #8b929c;
      }
      button {
        background: #262a30; color: #d7dbe0; border: 1px solid #363b42;
        border-radius: 5px; padding: 3px 9px; cursor: pointer;
      }
      button:hover { background: #303640; }
      .tree { list-style: none; margin: 0; padding: 6px; overflow: auto; }
      .tree li { padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
      .tree li.dir { color: #cbd3dd; }
      .tree li { cursor: pointer; }
      .tree li:hover { background: #1c1f24; }
      /* files the provenance graph tracks (● marker); click pivots to provenance */
      .tree li.tracked { color: #8fd08a; }
      .cwd { font-family: ui-monospace, monospace; font-size: 12px; color: #cbd3dd;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .explorer-actions { display: flex; gap: 4px; flex: 0 0 auto; }
      .explorer-actions button { padding: 2px 7px; }

      /* Center column: xterm terminal (top) + egui graph canvas (bottom). */
      .center { background: #0c0d10; }
      .terminal {
        min-height: 0; padding: 6px 8px; overflow: hidden;
      }
      .terminal .xterm, .terminal .xterm-viewport { height: 100% !important; }
      .graph-canvas { flex: 1; width: 100%; min-height: 0; display: block; }

      .status {
        margin-left: auto; color: #8b929c; font-size: 12px;
      }
      .status.busy { color: #e0b04b; }
      .status.busy::before {
        content: ""; display: inline-block; width: 8px; height: 8px;
        margin-right: 6px; border-radius: 50%; background: #e0b04b;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }

      .log { flex: 1; overflow: auto; padding: 8px 10px; }
      .log .msg { padding: 5px 0; border-bottom: 1px solid #1c1f24; }
      .log .msg:last-child { border-bottom: 0; }
      .agent-badge {
        display: inline-block; font: 11px/1 ui-monospace, monospace;
        color: #d7dbe0; border-radius: 4px; padding: 3px 6px; margin: 2px 0;
      }
      .agent-body { margin-top: 2px; }
      .log details.tool {
        margin: 4px 0; border: 1px solid #262a30; border-radius: 5px;
        background: #101216;
      }
      .log details.tool summary {
        cursor: pointer; padding: 4px 8px; color: #7fb069;
        font-family: ui-monospace, monospace; font-size: 12px;
      }
      .log details.tool pre { margin: 0; border: 0; border-top: 1px solid #262a30; }
      .log .turn {
        margin: 8px 0; text-align: center; color: #8b929c; font-size: 12px;
        border-top: 1px dashed #363b42; padding-top: 4px;
      }
      .log .error { color: #e06c60; }
      .log .ws { color: #8b929c; font-size: 12px; }
      .log .doc .grounded { color: #8b929c; font-size: 12px; }
      .approvals { list-style: none; margin: 0; padding: 0; }
      .approvals .approval {
        display: flex; gap: 6px; align-items: center; padding: 6px 10px;
        border-top: 1px solid #4b3a1e; background: #1d1812;
      }
      .approvals .approval span {
        flex: 1; font-family: ui-monospace, monospace; font-size: 12px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .log .msg :first-child { margin-top: 0; }
      .log .msg :last-child { margin-bottom: 0; }
      .log pre {
        background: #0f1114; border: 1px solid #262a30; border-radius: 5px;
        padding: 8px; overflow-x: auto; font-family: ui-monospace, monospace;
      }
      .log code { font-family: ui-monospace, monospace; }
      .log .katex-display { margin: 6px 0; overflow-x: auto; overflow-y: hidden; }
      .prompt { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #262a30; }
      .prompt input {
        flex: 1; background: #0f1114; color: #d7dbe0;
        border: 1px solid #363b42; border-radius: 5px; padding: 5px 8px;
      }
    </style>
  </head>
  <body></body>
</html>
