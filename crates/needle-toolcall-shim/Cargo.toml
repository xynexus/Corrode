[package]
name = "needle-toolcall-shim"
version = "0.1.0"
edition = "2021"
# Apache-2.0 — Corrode's default for crates that link no GPL (like corrode-core /
# corrode-web). Vendored in from a now-unmaintained experiment; corrode-daemon (AGPL)
# pulls it in only behind `--features needle`. The Needle *model weights* remain an
# upstream artifact — see assets/needle/SOURCE.md for their provenance.
license = "Apache-2.0"
description = "Native Rust/Candle CPU inference for the Needle tool-call model (query + tools JSON -> JSON tool calls)."

[dependencies]
anyhow = "1.0"
candle-core = "0.10.2"
candle-nn = "0.10.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sentencepiece-rs = "0.2.2"

[dev-dependencies]
tempfile = "3.15"
