[package]
name = "corrode-daemon"
version = "0.0.0"
edition.workspace = true
# AGPL-3.0, NOT Apache: the `helix` feature links HelixDB's helix_engine in-process,
# and HelixDB is AGPL-3.0. In-process linking makes this binary a derivative work,
# so the daemon inherits AGPL (network-use clause included, since it serves the web
# UI). corrode-core and corrode-web link nothing GPL and stay Apache-2.0.
license = "AGPL-3.0"
description = "The Corrode agent daemon: hipfire swarm, graph<->git VFS, embedded HelixDB."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
axum.workspace = true
futures-util.workspace = true
async-trait.workspace = true
corrode-core.workspace = true
syn.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
tar.workspace = true
# Real pty-backed terminal sessions (replaces the echo). Blocking I/O, bridged to
# the async event channel by a per-session reader thread.
portable-pty = "0.9"

# Embedded graph+vector store, pinned via the git submodule at third_party/helix-db
# (tag v2.3.5). Optional so the base workspace builds without the heavy vendored
# compile. Enable with `--features helix`. NOTE: upstream helix-db uses native-tls,
# so `--features helix` needs system OpenSSL + pkg-config at build time (see CLAUDE.md).
[dependencies.helix-db]
path = "../../third_party/helix-db/helix-db"
optional = true

# helix companions (versions unify with helix-db's own): bumpalo for the arena
# every helix traversal borrows from; heed3 to name LMDB txn types in signatures.
[dependencies.bumpalo]
version = "3"
optional = true

[dependencies.heed3]
version = "0.22"
optional = true

# FUSE mount of the Vfs, so git and subagent shells see the graph<->git projection
# as a real filesystem. Pure-protocol crate (no libfuse-dev); needs fusermount3 at
# runtime. `unprivileged` lets the daemon mount without root (via fusermount3).
# Optional — off by default, like helix.
[dependencies.fuse3]
version = "0.9"
features = ["tokio-runtime", "unprivileged"]
optional = true

# Pulled in only by the `fuse` feature: `bytes` for ReplyData, `libc` for errno
# constants and getuid/getgid on the mount owner.
[dependencies.bytes]
version = "1"
optional = true

[dependencies.libc]
version = "0.2"
optional = true

# Needle tool-call shim: a tiny CPU/candle encoder-decoder that turns `query + tools
# JSON` into structurally-valid tool calls, so the swarm's small models don't have to
# format calls themselves. Vendored in-repo at crates/needle-toolcall-shim (a merged-in
# experiment — see the workspace `exclude`), so it's not part of the base build/test
# graph. Optional; enable with `--features needle` and set `CORRODE_NEEDLE_ASSETS`
# (defaults to the vendored crate's assets/ dir).
[dependencies.needle-toolcall-shim]
path = "../needle-toolcall-shim"
optional = true

# Document ingestion for the doc GraphRAG (`AgentCommand::DocIngest`): docling.rs,
# vendored via the git submodule at third_party/docling.rs (MIT). Deliberately
# `default-features = false` + `pdf-text`: the pure-Rust converters (DOCX/HTML/MD/
# XLSX/PPTX + PDF text layer) with NO pdfium/ONNX — model-backed layout/OCR is
# planned to route through hipfire-served models, not ort. `docling-rag` is
# intentionally unused (HelixDB owns chunks/vectors/search here).
[dependencies.docling]
path = "../../third_party/docling.rs/crates/docling"
default-features = false
features = ["pdf-text"]
optional = true

[features]
default = []
helix = ["dep:helix-db", "dep:bumpalo", "dep:heed3"]
fuse = ["dep:fuse3", "dep:bytes", "dep:libc"]
needle = ["dep:needle-toolcall-shim"]
docling = ["dep:docling"]

[[bin]]
name = "corrode-daemon"
path = "src/main.rs"
