name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The optional helix-db path dependency's manifest must resolve even for
          # the base build (it isn't compiled unless --features helix). No nested
          # submodules, so a shallow, non-recursive fetch is enough.
          submodules: true
      # ubuntu-latest ships a stable Rust toolchain; no setup step needed.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  graph-store:
    # The graph store (HelixDB, linked in-process) and doc ingestion (docling.rs)
    # are feature-gated, so the build job above never compiles them; this one
    # builds and tests them on every PR. helix-db links OpenSSL (its metrics crate
    # uses native-tls).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo test -p corrode-daemon --features helix,docling --locked

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # webui is outside the workspace (own Cargo.toml, wasm-only) — check it on
      # its own target from its own directory.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --locked
        working-directory: webui
